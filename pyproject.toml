[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailocalvideo"
version = "0.1.0"
description = "Système local de génération de vidéos par IA (diffusers), API + Web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ailocalvideo = "backend.main:run"

[tool.setuptools]
packages = ["backend", "backend.generation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
